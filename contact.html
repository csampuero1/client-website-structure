<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact &amp; Orders | North Star Bakery</title>
</head>
<body>

    <header>
        <img src="images/bakery-logo_c.png" alt="North Star Bakery logo, loaf of bread with wheat stalk">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact &amp; Orders</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact &amp; Pre-Order Inquiries</h1>
        
        <h2>Location &amp; Hours</h2>
        <p><strong>Address:</strong> 123 Main Street, Neighborhood Center</p>
        <p><strong>Hours of Operation:</strong> Tuesday – Sunday: 6:00 AM – 2:00 PM</p>

        <h2>Inquiry and Pre-Order Request Form</h2>
        <form action="#" method="post">
            
            <fieldset>
                <legend>Contact Information</legend>
                <p>
                    <label for="user-name">Full Name:</label>
                    <input type="text" id="user-name" name="userName" required>
                </p>
                <p>
                    <label for="user-email">Email Address:</label>
                    <input type="email" id="user-email" name="userEmail" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Order Details</legend>
                <p>
                    <label for="pickup-date">Requested Pickup Date:</label>
                    <input type="date" id="pickup-date" name="pickupDate" required>
                </p>
                <p>
                    <label for="request-type">Request Type:</label>
                    <select id="request-type" name="requestType" required>
                        <option value="">-- Please Select --</option>
                        <option value="pre-order">Bakery Pre-Order</option>
                        <option value="question">General Question</option>
                    </select>
                </p>
                <p>
                    <label for="item-details">Item Details &amp; Quantities:</label>
                    <textarea id="item-details" name="itemDetails" rows="4" cols="40" required placeholder="e.g., 2 Sourdough Loaves, 4 Croissants"></textarea>
                </p>
                <p>
                    <label for="allergy-notes">Allergy Notes (If Applicable):</label>
                    <textarea id="allergy-notes" name="allergyNotes" rows="3" cols="40"></textarea>
                </p>
            </fieldset>

            <p>
                <button type="submit">Submit Request</button>
            </p>
        </form>
    </main>

    <footer>
        <p>North Star Bakery</p>
    </footer>

</body>
</html>
